# Anubis rules configuration file
#
# This mirrors the upstream default configuration
# https://github.com/TecharoHQ/anubis/blob/main/data/meta/default-config.yaml
# but adds the ALLOW rules for our APIs and uses the moderate instead of the
# aggressive AI bot policy. Prefer importing the upstream rule files over copying
# their contents, so that updates are picked up automatically.


bots:
  # Explicitly always allow access to the rest API
  - name: allow-api-v2
    expression: 'path.startsWith("/api/v2")'
    action: ALLOW

  - name: allow-allauth-api
    expression: 'path.startsWith("/allauth")'
    action: ALLOW

  - name: allow-oauth-api
    expression: 'path.startsWith("/identity/")'
    action: ALLOW

  # Pathological bots to deny
  # This correlates to data/bots/_deny-pathological.yaml in the source tree
  # https://github.com/TecharoHQ/anubis/blob/main/data/bots/_deny-pathological.yaml
  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/aggressive-brazilian-scrapers.yaml

  # AI bot policy
  #- import: (data)/meta/ai-block-aggressive.yaml
  - import: (data)/meta/ai-block-moderate.yaml
  # - import: (data)/meta/ai-block-permissive.yaml

  # x.ai has a scraper that is killing gitlab instances. It is not part of the
  # moderate AI policy, so it needs to be imported separately.
  - import: (data)/crawlers/xai.yaml

  # Search engine crawlers to allow, defaults to:
  #   - Google (so they don't try to bypass Anubis)
  #   - Apple
  #   - Bing
  #   - DuckDuckGo
  #   - Qwant
  #   - The Internet Archive
  #   - Kagi
  #   - Marginalia
  #   - Mojeek
  - import: (data)/crawlers/_allow-good.yaml

  # Challenge Firefox AI previews
  - import: (data)/clients/x-firefox-ai.yaml

  # Let small internet browsers (Dillo, NetSurf, Pale Moon) through, they can't
  # solve the challenge and would be locked out otherwise
  - import: (data)/clients/small-internet-browsers/_permissive.yaml

  # Allow common "keeping the internet working" routes (well-known, favicon, robots.txt)
  - import: (data)/common/keep-internet-working.yaml

  # # Punish any bot with "bot" in the user-agent string
  # # This is known to have a high false-positive rate, use at your own risk
  # - name: generic-bot-catchall
  #   user_agent_regex: (?i:bot|crawler)
  #   action: CHALLENGE
  #   challenge:
  #     difficulty: 16  # impossible
  #     report_as: 4    # lie to the operator
  #     algorithm: slow # intentionally waste CPU cycles and time

  # ## System load based checks.
  # # If the system is under high load, add weight.
  # - name: high-load-average
  #   action: WEIGH
  #   expression: load_1m >= 10.0 # make sure to end the load comparison in a .0
  #   weight:
  #     adjust: 20

  ## If your backend service is running on the same operating system as Anubis,
  ## you can uncomment this rule to make the challenge easier when the system is
  ## under low load.
  ##
  ## If it is not, remove weight.
  # - name: low-load-average
  #   action: WEIGH
  #   expression: load_15m <= 4.0 # make sure to end the load comparison in a .0
  #   weight:
  #     adjust: -10

  # Assert behaviour that only genuine browsers display, so that modern Chrome or
  # Firefox versions get through without a challenge. Also contains the generic
  # "looks like a browser" catchall rule.
  - import: (data)/common/acts-like-browser.yaml

store:
  #backend: memory
  #  parameters: { }

  backend: valkey
  parameters:
    url: "redis://cache:6379/3"